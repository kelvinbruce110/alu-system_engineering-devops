<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Lost in space</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1b2735, #090a0f);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
    text-align: center;
  }
  .card {
    padding: 3rem 2rem;
    border-radius: 20px;
    background: rgba(255,255,255,.06);
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
  }
  h1 {
    font-size: 6rem;
    margin: 0;
    letter-spacing: .5rem;
    background: linear-gradient(90deg, #ff6b6b, #f7b731);
    -webkit-background-clip: text;
    color: transparent;
  }
  .rocket { font-size: 4rem; animation: float 3s ease-in-out infinite; }
  p { font-size: 1.2rem; color: #cbd5e1; }
  .tag {
    display: inline-block;
    margin-top: 1rem;
    padding: .5rem 1rem;
    border-radius: 999px;
    background: #f7b731;
    color: #111;
    font-weight: bold;
  }
  a { color: #ff6b6b; text-decoration: none; }
  @keyframes float { 50% { transform: translateY(-10px) rotate(5deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="rocket">🛰️</div>
    <h1>404</h1>
    <p>Lost in space? This page drifted away.</p>
    <p>Ceci n'est pas une page.</p>
    <span class="tag">Back to <a href="/">home</a></span>
  </div>
</body>
</html>
